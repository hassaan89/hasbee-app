    /************************************************************
     * Media, Video, Images, Voice
     ************************************************************/
    async function handleAttachment() {
      const file = app.el.fileInput.files?.[0];
      app.el.fileInput.value = "";
      if (!file) return;
      if (file.type.startsWith("video/") && file.size > 25 * 1024 * 1024) {
        showToast("Videos must be 25MB or less.");
        return;
      }
      let blob = file;
      let type = file.type.startsWith("image/") ? "image" : "video";
      if (type === "image") blob = await compressImage(file);
      await sendMediaMessage(blob, type, file.name || `${type}-${Date.now()}`);
    }

    async function compressImage(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, 1200 / bitmap.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", .82));
    }

    async function sendMediaMessage(blob, type, fileName, duration = 0) {
      const fileId = crypto.randomUUID();
      if (!app.decoyMode) await idbPut("mediaCache", { fileId, blob, mimeType: blob.type, timestamp: Date.now() });
      app.mediaBlobs.set(fileId, blob);
      app.mediaUrls.set(fileId, URL.createObjectURL(blob));
      const meta = baseMessageMeta(type, fileId, app.replyTo);
      const payload = { fileId, fileName, mimeType: blob.type, size: blob.size, duration };
      const message = await saveMessage(meta, payload);
      clearReply();
      if (!app.decoyMode) {
        await sendEncrypted("chat", { type: "message", message: wireMessage(message) });
        await sendFileChunks(fileId, blob, fileName);
      }
    }

    async function sendFileChunks(fileId, blob, fileName) {
      const buffer = await blob.arrayBuffer();
      const chunkSize = 16 * 1024;
      const total = Math.ceil(buffer.byteLength / chunkSize);
      app.outgoingFiles.set(fileId, { buffer, blob, fileName, total, mimeType: blob.type });
      for (let index = 0; index < total; index++) {
        const chunk = buffer.slice(index * chunkSize, Math.min(buffer.byteLength, (index + 1) * chunkSize));
        await sendEncrypted("media", { type: "chunk", fileId, index, total, mimeType: blob.type, fileName, data: bufToBase64(chunk) });
        app.messageProgress.set(fileId, Math.round(((index + 1) / total) * 100));
        scheduleRender();
      }
      setTimeout(() => {
        app.messageProgress.delete(fileId);
        scheduleRender();
      }, 700);
    }

    async function receiveFileChunk(chunk) {
      let entry = app.incomingFiles.get(chunk.fileId);
      if (!entry) {
        entry = { chunks: new Array(chunk.total), total: chunk.total, mimeType: chunk.mimeType, fileName: chunk.fileName, received: 0 };
        app.incomingFiles.set(chunk.fileId, entry);
      }
      if (!entry.chunks[chunk.index]) {
        entry.chunks[chunk.index] = base64ToBuf(chunk.data);
        entry.received++;
      }
      app.messageProgress.set(chunk.fileId, Math.round((entry.received / entry.total) * 100));
      scheduleRender();
      if (entry.received === entry.total) {
        const blob = new Blob(entry.chunks, { type: entry.mimeType });
        await idbPut("mediaCache", { fileId: chunk.fileId, blob, mimeType: entry.mimeType, timestamp: Date.now() });
        app.mediaBlobs.set(chunk.fileId, blob);
        app.mediaUrls.set(chunk.fileId, URL.createObjectURL(blob));
        app.incomingFiles.delete(chunk.fileId);
        setTimeout(() => app.messageProgress.delete(chunk.fileId), 700);
        renderMessages({ preserveScroll: true });
      }
    }

    async function retransmitChunk(fileId, index) {
      const entry = app.outgoingFiles.get(fileId);
      if (!entry) return;
      const chunkSize = 16 * 1024;
      const chunk = entry.buffer.slice(index * chunkSize, Math.min(entry.buffer.byteLength, (index + 1) * chunkSize));
      await sendEncrypted("media", { type: "chunk", fileId, index, total: entry.total, mimeType: entry.mimeType, fileName: entry.fileName, data: bufToBase64(chunk) });
    }

    function openLightbox(src) {
      if (!src) return;
      app.el.lightboxImage.src = src;
      app.el.lightbox.classList.add("open");
      let scale = 1;
      let baseDistance = 0;
      const img = app.el.lightboxImage;
      img.style.transform = "scale(1)";
      img.ontouchstart = (event) => {
        if (event.touches.length === 2) baseDistance = touchDistance(event.touches);
      };
      img.ontouchmove = (event) => {
        if (event.touches.length === 2 && baseDistance) {
          event.preventDefault();
          scale = Math.max(1, Math.min(4, touchDistance(event.touches) / baseDistance));
          img.style.transform = `scale(${scale})`;
        }
      };
    }

    function closeLightbox() {
      app.el.lightbox.classList.remove("open");
      app.el.lightboxImage.src = "";
    }

    function touchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    function bindVoiceEvents() {
      let startX = 0;
      app.el.micBtn.addEventListener("pointerdown", (event) => {
        startX = event.clientX;
        app.el.micBtn.setPointerCapture(event.pointerId);
        startRecordingVoice().catch(() => showToast("Microphone permission is needed."));
      });
      app.el.micBtn.addEventListener("pointermove", (event) => {
        if (app.recording && startX - event.clientX > 80) {
          app.recording.cancelled = true;
          app.el.recordingBar.style.borderColor = "#e05555";
        }
      });
      app.el.micBtn.addEventListener("pointerup", () => stopRecordingVoice().catch(() => showToast("Voice note could not be sent.")));
      app.el.micBtn.addEventListener("pointercancel", () => {
        if (app.recording) app.recording.cancelled = true;
        stopRecordingVoice().catch(() => {});
      });
    }

    async function startRecordingVoice() {
      if (app.recording) return;
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      const recorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];
      recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
      recorder.start();
      app.recording = { recorder, stream, chunks, started: Date.now(), cancelled: false, raf: 0, lastWaveUpdate: 0 };
      app.el.composer.classList.add("recording");
      animateRecordingWave();
    }

    async function stopRecordingVoice() {
      const rec = app.recording;
      if (!rec) return;
      await new Promise((resolve) => {
        rec.recorder.onstop = resolve;
        rec.recorder.stop();
      });
      rec.stream.getTracks().forEach((track) => track.stop());
      cancelAnimationFrame(rec.raf);
      app.el.composer.classList.remove("recording");
      app.el.recordingBar.style.borderColor = "#e05555";
      const duration = Math.round((Date.now() - rec.started) / 1000);
      app.recording = null;
      if (rec.cancelled || duration < 1) {
        showToast("Voice note cancelled.");
        return;
      }
      const blob = new Blob(rec.chunks, { type: rec.recorder.mimeType || "audio/webm" });
      await sendMediaMessage(blob, "audio", `voice-${Date.now()}.webm`, duration);
    }

    function renderLiveWave() {
      app.el.liveWave.innerHTML = Array.from({ length: 20 }, () => "<span></span>").join("");
    }

    function animateRecordingWave() {
      if (!app.recording) return;
      const elapsed = Math.floor((Date.now() - app.recording.started) / 1000);
      app.el.recordTime.textContent = formatDuration(elapsed);
      if (Date.now() - app.recording.lastWaveUpdate > 100) {
        app.recording.lastWaveUpdate = Date.now();
        app.el.liveWave.querySelectorAll("span").forEach((bar) => {
          const h = 5 + Math.round(Math.random() * 22);
          bar.style.height = `${h}px`;
        });
      }
      app.recording.raf = requestAnimationFrame(animateRecordingWave);
    }

    async function toggleVoicePlayback(msg) {
      const blob = app.mediaBlobs.get(msg.fileId);
      if (!blob) return showToast("Voice note is still transferring.");
      if (app.activeAudioId && app.activeAudioId !== msg.id) {
        const active = app.audioPlayers.get(app.activeAudioId);
        active?.pause();
      }
      let audio = app.audioPlayers.get(msg.id);
      if (!audio) {
        audio = new Audio(URL.createObjectURL(blob));
        audio.playbackRate = app.voiceSpeeds.get(msg.id) || 1;
        audio.ontimeupdate = () => updateVoiceProgress(msg.id, audio);
        audio.onended = () => {
          app.activeAudioId = null;
          updateVoiceProgress(msg.id, audio, true);
          renderMessages({ preserveScroll: true });
        };
        app.audioPlayers.set(msg.id, audio);
      }
      if (audio.paused) {
        app.activeAudioId = msg.id;
        audio.playbackRate = app.voiceSpeeds.get(msg.id) || 1;
        await audio.play();
      } else {
        audio.pause();
        app.activeAudioId = null;
      }
      renderMessages({ preserveScroll: true });
    }

    function updateVoiceProgress(id, audio, reset = false) {
      const wave = document.querySelector(`[data-wave="${id}"]`);
      if (!wave) return;
      const progress = reset || !audio.duration ? 0 : audio.currentTime / audio.duration;
      const bars = wave.querySelectorAll("span");
      bars.forEach((bar, index) => {
        const filled = index / bars.length <= progress;
        bar.style.background = filled ? "#c97ab2" : "rgba(255,255,255,.2)";
      });
    }

    function cycleVoiceSpeed(id) {
      const current = app.voiceSpeeds.get(id) || 1;
      const next = current === 1 ? 1.5 : current === 1.5 ? 2 : 1;
      app.voiceSpeeds.set(id, next);
      const audio = app.audioPlayers.get(id);
      if (audio) audio.playbackRate = next;
      renderMessages({ preserveScroll: true });
    }

    /************************************************************
     * Search, Disappearing Messages, Notifications
     ************************************************************/
    function toggleSearch() {
      app.el.searchPanel.classList.toggle("open");
      if (app.el.searchPanel.classList.contains("open")) app.el.searchInput.focus();
      else {
        activeSearch = "";
        app.el.searchInput.value = "";
        app.el.searchResults.innerHTML = "";
        renderMessages({ preserveScroll: true });
      }
    }

    function runSearch() {
      const query = app.el.searchInput.value.trim();
      activeSearch = query;
      app.el.searchResults.innerHTML = "";
      if (!query) {
        renderMessages({ preserveScroll: true });
        return;
      }
      const q = query.toLowerCase();
      const results = app.messages.filter((msg) => msg.type === "text" && (msg.payload.text || "").toLowerCase().includes(q)).slice(-30).reverse();
      results.forEach((msg) => {
        const btn = document.createElement("button");
        btn.className = "search-result";
        const text = messagePlainText(msg);
        btn.innerHTML = `${escapeHtml(msg.senderId === app.myId ? "You" : settings.partnerName || "Tasbeeha")} · ${formatTime(msg.timestamp)}<br>${highlightText(escapeHtml(text.slice(0, 100)), query)}`;
        btn.onclick = () => scrollToMessage(msg.id);
        app.el.searchResults.appendChild(btn);
      });
      renderMessages({ preserveScroll: true });
    }

    function scrollToMessage(id) {
      const index = app.messages.findIndex((msg) => msg.id === id);
      if (index >= 0 && app.messages.length > 160) app.el.chatArea.scrollTop = Math.max(0, index * 96 - 180);
      renderMessages({ preserveScroll: true });
      requestAnimationFrame(() => {
        const row = document.querySelector(`.message-row[data-id="${id}"] .bubble`);
        if (row) {
          row.classList.add("flash");
          row.scrollIntoView({ block: "center", behavior: "smooth" });
          setTimeout(() => row.classList.remove("flash"), 1500);
        }
      });
    }

    function startDisappearSweep() {
      clearInterval(disappearTimer);
      disappearTimer = setInterval(async () => {
        const now = Date.now();
        const expired = app.messages.filter((msg) => msg.expiresAt && msg.expiresAt <= now);
        for (const msg of expired) await expireMessage(msg.id, false);
        if (expired.length) renderMessages();
        else if (app.messages.some((msg) => msg.expiresAt)) scheduleRender();
      }, 15000);
    }

    async function expireMessage(messageId, remote) {
      const msg = app.messages.find((item) => item.id === Number(messageId) || item.clientId === messageId);
      if (!msg) return;
      app.messages = app.messages.filter((item) => item !== msg);
      await idbDelete("messages", msg.id);
      if (!remote) await sendEncrypted("chat", { type: "expire", messageId: msg.clientId }).catch(() => {});
    }

    function notifyNewMessage() {
      if (document.visibilityState === "visible") return;
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const icon = `data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#1e1128"/><text x="43" y="84" font-family="Georgia,serif" font-style="italic" font-size="58" fill="#f5d0e8">H</text><circle cx="82" cy="42" r="8" fill="#c97ab2"/></svg>')}`;
      const notification = new Notification("Hasbee", { body: "New message 💕", icon });
      notification.onclick = () => window.focus();
    }

      setConnectionStatus(app.status);
    }

    }

          <div class="setting-row"><label><span class="setting-title">Notification sound</span><span class="setting-note">Notifications never reveal message text.</span></label><button id="soundToggle" class="switch ${settings.notificationSound ? "on" : ""}" type="button"><span></span></button></div>

        </section>
        <section class="settings-card">
          <h3>Danger zone</h3>
          <div class="setting-row"><label><span class="setting-title">Clear all messages</span><span class="setting-note">Deletes chat history from this phone.</span></label><button id="clearMessages" class="secondary-btn danger-btn">Clear</button></div>
          <div class="setting-row"><label><span class="setting-title">Factory reset</span><span class="setting-note">Wipes messages, PINs, settings, and keys.</span></label><button id="factoryReset" class="secondary-btn danger-btn">Reset</button></div>
        </section>
        <section class="settings-card">
          <h3>About</h3>
          <div class="small-muted">Version 1.0. End-to-end encrypted by Web Crypto API.</div>
          <div class="about-logo"><span class="logo-font">Hasbee<span class="rose-dot"></span></span></div>
          <div class="small-muted" style="text-align:center">Made with love by Hassaan &amp; Tasbeeha</div>
        </section>
      `;
      $("autoLock").value = String(settings.autoLockMinutes || 5);
      $("disappearTimer").value = String(settings.disappearTimer || 0);
      $("settingsName").onchange = async (event) => {
        await putSetting("name", event.target.value.trim());
        showToast("Name saved.");
      };
      $("settingsAvatar").oninput = async (event) => {
        await putSetting("avatarColor", event.target.value);
        renderAppChrome();
      };
      $("autoLock").onchange = async (event) => {
        await putSetting("autoLockMinutes", Number(event.target.value));
        resetInactivityTimer();
      };
      $("disappearTimer").onchange = async (event) => {
        await putSetting("disappearTimer", Number(event.target.value));
      };
      $("soundToggle").onclick = async () => {
        await putSetting("notificationSound", !settings.notificationSound);
        renderSettings();
      };
      $("changePin").onclick = () => openPinModal("Main PIN", "pinHash", "pinSalt");
      $("changeDecoy").onclick = () => openPinModal("Decoy PIN", "decoyPinHash", "decoyPinSalt");
      $("repairConnection").onclick = openReconnectModal;
      $("forgetPairing").onclick = () => confirmDanger("Forget pairing?", "This keeps chats and PINs, but removes the current live connection keys so you can pair again cleanly.", resetPairingOnly);
      $("exportBackup").onclick = () => exportBackup().catch(() => showToast("Backup could not be exported."));
      $("importBackupBtn").onclick = () => $("importBackup").click();
      $("importBackup").onchange = () => importBackup($("importBackup").files?.[0]).catch(() => showToast("Backup could not be imported."));
      $("clearMessages").onclick = () => confirmDanger("Clear all messages?", "This removes messages from this phone.", async () => {
        await idbClear("messages");
        await idbClear("mediaCache");
        app.messages = [];
        app.mediaUrls.forEach((url) => URL.revokeObjectURL(url));
        app.mediaUrls.clear();
        app.mediaBlobs.clear();
        renderMessages();
      });
      $("factoryReset").onclick = () => confirmDanger("Factory reset?", "This wipes all messages, settings, PINs, and keys on this phone.", async () => {
        await Promise.all(["messages", "settings", "cryptoKeys", "offlineQueue", "mediaCache"].map(idbClear));
        location.reload();
      });
    }

    function openReconnectModal() {
      const modal = app.el.modal;
      modal.innerHTML = `
        <div class="modal-card">
          <h3>Reconnect Hasbee</h3>
          <p>Your chat history is already saved after PIN unlock. This only opens a fresh live connection for syncing new messages.</p>
          <div class="settings-actions">
            <button id="modalGenerateOffer" class="secondary-btn">Generate code</button>
            <button id="modalCloseReconnect" class="secondary-btn">Done</button>
          </div>
          <div id="reconnectOfferCode" class="code-box">${escapeHtml(app.currentOfferCode || settings.lastOfferCode || "")}</div>
          <div id="reconnectOfferQr" class="qr-box">${app.currentOfferCode || settings.lastOfferCode ? createQrSvg(app.currentOfferCode || settings.lastOfferCode) : ""}</div>
          <textarea id="reconnectRemoteCode" class="field" rows="4" placeholder="Paste partner's offer or answer code"></textarea>
          <button id="modalUseRemoteCode" class="primary-btn">Use partner code</button>
          <div id="reconnectAnswerCode" class="code-box">${escapeHtml(app.currentAnswerCode || settings.lastAnswerCode || "")}</div>
          <div id="reconnectAnswerQr" class="qr-box">${app.currentAnswerCode || settings.lastAnswerCode ? createQrSvg(app.currentAnswerCode || settings.lastAnswerCode) : ""}</div>
          <p class="small-muted">If both phones were fully closed, one phone generates a code, the other pastes it, then sends the answer code back. Messages are not cleared.</p>
        </div>
      `;
      modal.classList.add("show");
      $("modalGenerateOffer").onclick = () => generateOfferCode().catch(() => showToast("Could not generate a reconnect code."));
      $("modalUseRemoteCode").onclick = () => useRemoteSignal($("reconnectRemoteCode").value).catch((err) => showToast(err.message || "Code could not be used."));
      $("modalCloseReconnect").onclick = () => modal.classList.remove("show");
      modal.onclick = (event) => { if (event.target === modal) modal.classList.remove("show"); };
    }

    async function resetPairingOnly() {
      try {
        app.chatChannel?.close();
        app.mediaChannel?.close();
        app.pc?.close();
      } catch (err) {}
      app.pc = null;
      app.chatChannel = null;
      app.mediaChannel = null;
      app.currentOfferCode = "";
      app.currentAnswerCode = "";
      await idbDelete("cryptoKeys", "aesShared");
      await putSetting("partnerPublicKey", "");
      await putSetting("lastOfferCode", "");
      await putSetting("lastAnswerCode", "");
      await putSetting("connectionPairedAt", 0);
      setConnectionStatus("offline");
      showToast("Pairing reset. Your chats are still here.");
    }

    function openPinModal(label, hashKey, saltKey) {
      showModal({
        title: `Set ${label}`,
        body: "Enter a new 6 digit PIN.",
        fields: [{ type: "password", placeholder: "6 digits", maxLength: 6, inputMode: "numeric" }],
        confirmText: "Save",
        onConfirm: async ([pin]) => {
          if (!/^\d{6}$/.test(pin)) throw new Error("Use exactly 6 digits.");
          const result = await hashPin(pin);
          await putSetting(hashKey, result.hash);
          await putSetting(saltKey, result.salt);
          showToast(`${label} saved.`);
        }
      });
    }

    function confirmDanger(title, body, action) {
      showModal({ title, body, confirmText: "Confirm", danger: true, onConfirm: action });
    }

    async function exportBackup() {
      const backup = {
        exportedAt: Date.now(),
        settings: await idbGetAll("settings"),
        messages: (await idbGetAll("messages")).map(serializeRecordBuffers),
        offlineQueue: (await idbGetAll("offlineQueue")).map(serializeRecordBuffers),
        mediaCache: await Promise.all((await idbGetAll("mediaCache")).map(async (row) => ({
          ...row,
          blob: bufToBase64(await row.blob.arrayBuffer())
        })))
      };
      const encrypted = await encryptObject(backup);
      const file = {
        app: "Hasbee",
        encrypted: true,
        iv: bufToBase64(encrypted.iv),
        data: bufToBase64(encrypted.data)
      };
      downloadBlob(new Blob([JSON.stringify(file, null, 2)], { type: "application/json" }), `hasbee-backup-${new Date().toISOString().slice(0,10)}.json`);
    }

    async function importBackup(file) {
      if (!file) return;
      const parsed = JSON.parse(await file.text());
      if (parsed.app !== "Hasbee" || !parsed.encrypted) throw new Error("Not a Hasbee backup.");
      const backup = await decryptObject(base64ToBuf(parsed.data), new Uint8Array(base64ToBuf(parsed.iv)));
      await idbClear("messages");
      await idbClear("offlineQueue");
      await idbClear("mediaCache");
      for (const row of backup.settings || []) await idbPut("settings", row);
      for (const row of backup.messages || []) await idbPut("messages", deserializeRecordBuffers(row));
      for (const row of backup.offlineQueue || []) await idbPut("offlineQueue", deserializeRecordBuffers(row));
      for (const row of backup.mediaCache || []) {
        await idbPut("mediaCache", { ...row, blob: new Blob([base64ToBuf(row.blob)], { type: row.mimeType }) });
      }
      await loadSettings();
      await loadMessages();
      showToast("Backup restored.");
    }

    function serializeRecordBuffers(row) {
      const out = { ...row };
      if (out.content) out.content = bufToBase64(out.content);
      if (out.iv) out.iv = bufToBase64(out.iv);
      if (out.payload) out.payload = bufToBase64(out.payload);
      return out;
    }

    function deserializeRecordBuffers(row) {
      const out = { ...row };
      if (typeof out.content === "string") out.content = base64ToBuf(out.content);
      if (typeof out.iv === "string") out.iv = new Uint8Array(base64ToBuf(out.iv));
      if (typeof out.payload === "string") out.payload = base64ToBuf(out.payload);
      return out;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /************************************************************
     * Inline SVG QR-style Transfer Code
     ************************************************************/
    function createQrSvg(text) {
      const size = 33;
      const cells = Array.from({ length: size }, () => Array(size).fill(false));
      addFinder(cells, 1, 1);
      addFinder(cells, size - 8, 1);
      addFinder(cells, 1, size - 8);
      const bytes = encoder.encode(text);
      let bitIndex = 0;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (isFinderArea(x, y, size)) continue;
          const byte = bytes[bitIndex % bytes.length] || 0;
          const bit = (byte >> (bitIndex % 8)) & 1;
          const mixed = bit ^ ((x * 3 + y * 5 + bitIndex) % 2);
          cells[y][x] = Boolean(mixed);
          bitIndex++;
        }
      }
      let rects = "";
      cells.forEach((row, y) => row.forEach((on, x) => {
        if (on) rects += `<rect x="${x + 2}" y="${y + 2}" width="1" height="1" fill="#c97ab2"/>`;
      }));
      return `<svg viewBox="0 0 ${size + 4} ${size + 4}" role="img" aria-label="Hasbee transfer code"><rect width="${size + 4}" height="${size + 4}" rx="2" fill="#0d0812"/><rect x="1" y="1" width="${size + 2}" height="${size + 2}" fill="none" stroke="#3a2550" stroke-width="1"/>${rects}</svg>`;
    }

    function addFinder(cells, x, y) {
      for (let yy = 0; yy < 7; yy++) {
        for (let xx = 0; xx < 7; xx++) {
          const outer = xx === 0 || xx === 6 || yy === 0 || yy === 6;
          const inner = xx >= 2 && xx <= 4 && yy >= 2 && yy <= 4;
          cells[y + yy][x + xx] = outer || inner;
        }
      }
    }

    function isFinderArea(x, y, size) {
      return (x <= 8 && y <= 8) || (x >= size - 9 && y <= 8) || (x <= 8 && y >= size - 9);
    }

    /************************************************************
     * Formatting Helpers
     ************************************************************/
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }

    function highlightText(htmlText, query) {
      if (!query) return htmlText.replace(/\n/g, "<br>");
      const safe = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return htmlText.replace(new RegExp(`(${safe})`, "gi"), "<mark>$1</mark>").replace(/\n/g, "<br>");
    }

    function messagePlainText(msg) {
      if (msg.deletedForEveryone) return "This message was deleted";
      if (msg.type === "text") return msg.payload.text || "";
      if (msg.type === "image") return "Photo";
      if (msg.type === "video") return "Video";
      if (msg.type === "audio") return "Voice message";
      return "Message";
    }

    function formatTime(timestamp) {
      return new Intl.DateTimeFormat([], { hour: "2-digit", minute: "2-digit" }).format(new Date(timestamp));
    }

    function formatDateSeparator(timestamp) {
      const date = new Date(timestamp);
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      if (date.toDateString() === today.toDateString()) return "Today";
      if (date.toDateString() === yesterday.toDateString()) return "Yesterday";
      return new Intl.DateTimeFormat([], { weekday: "short", day: "2-digit", month: "short" }).format(date);
    }

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60).toString().padStart(2, "0");
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function formatRemaining(ms) {
      if (ms < 60000) return `${Math.ceil(ms / 1000)}s`;
      if (ms < 3600000) return `${Math.ceil(ms / 60000)}m`;
      if (ms < 86400000) return `${Math.ceil(ms / 3600000)}h`;
      return `${Math.ceil(ms / 86400000)}d`;
    }

    function timeAgo(timestamp) {
      const mins = Math.max(1, Math.round((Date.now() - timestamp) / 60000));
      if (mins < 60) return `${mins} mins ago`;
      return `${Math.round(mins / 60)} hrs ago`;
    }

    function isMobileLike() {
      return matchMedia("(pointer: coarse)").matches || window.innerWidth < 700;
    }
  })();
  </script>

  <!--
  HASBEE SETUP GUIDE:

  a) How to host on GitHub Pages for free:
  1. Create a free GitHub account.
  2. Create a new public or private repository named hasbee.
  3. Upload this file as index.html in the repository root.
  4. Open repository Settings, then Pages.
  5. Under Build and deployment, choose Deploy from a branch.
  6. Select the main branch and /root folder, then Save.
  7. Wait for GitHub to show the Pages URL, then open that same URL on both phones.

  b) How to do the WebRTC handshake between two phones:
  1. Open the Hasbee URL on both phones.
  2. On Hassaan's phone choose "I'm starting" and tap "Generate a code".
  3. Send that offer code to Tasbeeha or let her copy it from your screen.
  4. On Tasbeeha's phone paste it into "I got a code" and tap "Use code".
  5. Tasbeeha's phone creates an answer code.
  6. Paste that answer code back into Hassaan's "Paste answer code" box and tap "Use answer".
  7. When the header dot is green, the private peer-to-peer channel is open.
  8. If the phones lose connection later, the chat history remains after PIN unlock.
  9. Tap the offline "Reconnect" button or Settings > Connection > Reconnect to make a fresh live channel.

  c) How to install as PWA:
  Android Chrome:
  1. Open the hosted Hasbee URL.
  2. Tap the three-dot browser menu.
  3. Tap "Add to Home screen" or "Install app".
  4. Open Hasbee from the new home-screen icon.

  iOS Safari:
  1. Open the hosted Hasbee URL in Safari.
  2. Tap the Share button.
  3. Tap "Add to Home Screen".
  4. Tap Add, then open Hasbee from the home-screen icon.

  d) How to set the main PIN and decoy PIN:
  1. On first launch, enter your name.
  2. Choose a 6 digit secret PIN and confirm it.
  3. Turn on "Set a decoy PIN too?" if you want a second PIN.
  4. The decoy PIN opens a blank empty chat with no message history.
  5. Later, open Settings > Security to change either PIN.

  e) How to export and restore a chat backup:
  1. Open Settings > Backup.
  2. Tap "Export" to download an encrypted JSON backup file.
  3. Keep that backup somewhere private.
  4. To restore, open Settings > Backup and tap "Import".
  5. Choose the backup JSON file. The current app key is used to decrypt it.
  -->
