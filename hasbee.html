<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c97ab2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hasbee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    :root {
      --hb-night: #0d0812;
      --hb-deep: #1e1128;
      --hb-dusk: #3a2550;
      --hb-bloom: #7a3a68;
      --hb-rose: #c97ab2;
      --hb-petal: #f5d0e8;
      --hb-mist: #fdf6fb;
      --hb-ghost: #5a3d6a;
      --hb-lock: #7a5e8a;
      --hb-green: #4ade80;
      --hb-yellow: #facc15;
      --hb-red: #e05555;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--hb-night); }
    body {
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      color: var(--hb-petal);
      letter-spacing: 0;
    }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      outline: none;
    }
    button { cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    svg { display: block; }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      background: var(--hb-night);
      color: var(--hb-petal);
    }
    .screen.active { display: flex; }
    .safe-pad { padding-top: max(18px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    .logo-font { font-family: "DM Serif Display", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: 0; }
    .tagline-font {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      letter-spacing: .18em;
      text-transform: lowercase;
    }
    .rose-dot {
      display: inline-block;
      width: .28em;
      height: .28em;
      margin-left: .06em;
      border-radius: 999px;
      background: var(--hb-rose);
      transform: translateY(-.7em);
    }
    .icon-button {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--hb-lock);
      border-radius: 999px;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .icon-button:active { transform: scale(.94); background: var(--hb-dusk); }
    .field, .select {
      width: 100%;
      background: var(--hb-deep);
      border: 1px solid var(--hb-dusk);
      border-radius: 14px;
      color: var(--hb-petal);
      min-height: 48px;
      padding: 12px 14px;
    }
    .field::placeholder, textarea::placeholder { color: var(--hb-ghost); }
    .field:focus, .select:focus, textarea:focus {
      border-color: var(--hb-rose);
      box-shadow: 0 0 0 2px var(--hb-rose);
    }
    .primary-btn {
      min-height: 52px;
      width: 100%;
      border-radius: 14px;
      background: var(--hb-rose);
      color: var(--hb-mist);
      font-size: 15px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 150ms ease-out, filter 150ms ease;
    }
    .primary-btn:active { transform: scale(.96); filter: brightness(1.03); }
    .secondary-btn {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--hb-dusk);
      background: var(--hb-deep);
      color: var(--hb-petal);
      padding: 0 14px;
      font-size: 13px;
    }
    .danger-btn { color: var(--hb-red); border-color: rgba(224,85,85,.6); }

    /* Splash */
    #splash {
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform: translateY(-12px);
    }
    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: var(--hb-deep);
      border: 1px solid var(--hb-dusk);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-mark { font-size: 34px; color: var(--hb-petal); line-height: 1; position: relative; }
    .icon-mark .rose-dot { width: 8px; height: 8px; position: absolute; right: -11px; top: 5px; margin: 0; transform: none; }
    .wordmark { font-size: 38px; line-height: 1; color: var(--hb-petal); position: relative; }
    .wordmark .rose-dot { width: 9px; height: 9px; position: absolute; right: -14px; top: 4px; margin: 0; transform: none; }
    .splash-tagline { font-size: 14px; color: var(--hb-lock); }
    .pager-dots { display: flex; gap: 7px; align-items: center; justify-content: center; margin-top: 2px; }
    .pager-dots span { width: 5px; height: 5px; border-radius: 999px; background: var(--hb-dusk); }
    .pager-dots span:first-child { background: var(--hb-rose); }
    .splash-lock {
      position: absolute;
      bottom: max(30px, env(safe-area-inset-bottom));
      width: 36px;
      height: 36px;
      border: 1px solid var(--hb-dusk);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--hb-lock);
    }
    .splash-animate { opacity: 0; transform: translateY(20px); animation: splashIn 600ms var(--ease) forwards; }
    .splash-animate:nth-child(2) { animation-delay: 100ms; }
    .splash-animate:nth-child(3) { animation-delay: 200ms; }
    .splash-animate:nth-child(4) { animation-delay: 300ms; }
    @keyframes splashIn { to { opacity: 1; transform: translateY(0); } }

    /* PIN lock */
    #lock { flex-direction: column; align-items: center; justify-content: space-between; padding: max(24px, env(safe-area-inset-top)) 26px max(24px, env(safe-area-inset-bottom)); }
    .lock-mini-wordmark { font-size: 24px; color: var(--hb-petal); margin-top: 6px; position: relative; }
    .lock-mini-wordmark .rose-dot { width: 6px; height: 6px; position: absolute; right: -10px; top: 2px; margin: 0; transform: none; }
    .pin-center { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .pin-label {
      font-size: 13px;
      color: var(--hb-lock);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .pin-dots { display: flex; gap: 12px; align-items: center; justify-content: center; min-height: 20px; }
    .pin-dots.shake { animation: wrongShake 400ms ease; }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 1px solid var(--hb-dusk);
      background: transparent;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }
    .pin-dot.filled { background: var(--hb-rose); border-color: var(--hb-rose); animation: pinFill 200ms ease; }
    .pin-dot.error { background: var(--hb-red); border-color: var(--hb-red); }
    .lock-countdown { min-height: 20px; color: var(--hb-rose); font-size: 14px; text-align: center; }
    .number-pad { width: min(274px, 100%); display: grid; grid-template-columns: repeat(3, 64px); justify-content: center; gap: 14px 28px; }
    .pin-key {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      background: var(--hb-deep);
      border: 1px solid var(--hb-dusk);
      color: var(--hb-petal);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 100ms ease, background 100ms ease;
    }
    .pin-key:active { background: var(--hb-dusk); transform: scale(.94); }
    @keyframes pinFill { 0% { transform: scale(.8); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes wrongShake { 0% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } 100% { transform: translateX(0); } }

    /* Setup wizard */
    #setup { flex-direction: column; overflow: hidden; }
    .setup-shell { width: 100%; height: 100%; display: flex; flex-direction: column; padding: max(18px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }
    .setup-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 48px; }
    .setup-progress { display: flex; justify-content: center; gap: 8px; }
    .setup-progress span { width: 7px; height: 7px; border-radius: 999px; background: var(--hb-dusk); }
    .setup-progress span.active { background: var(--hb-rose); }
    .setup-body { flex: 1; width: min(100%, 300px); align-self: center; display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 0; }
    .setup-body.setup-wide { width: 100%; justify-content: flex-start; overflow-y: auto; padding-top: 14px; padding-bottom: 12px; }
    .setup-heading { font-size: 24px; font-weight: 500; color: var(--hb-petal); margin: 0; }
    .setup-subtext { font-size: 14px; color: var(--hb-lock); margin: 0; line-height: 1.5; }
    .setup-card-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .setup-card, .settings-card {
      background: var(--hb-deep);
      border: 1px solid var(--hb-dusk);
      border-radius: 14px;
      padding: 14px;
    }
    .setup-card { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .setup-card h3 { margin: 0; font-size: 14px; font-weight: 500; color: var(--hb-petal); }
    .setup-card p { margin: 0; font-size: 12px; color: var(--hb-lock); line-height: 1.4; }
    .code-box {
      width: 100%;
      min-height: 98px;
      max-height: 170px;
      overflow: auto;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10px;
      line-height: 1.45;
      color: var(--hb-petal);
      border: 1px solid var(--hb-dusk);
      border-radius: 10px;
      padding: 10px;
      background: var(--hb-night);
    }
    .qr-box { display: flex; justify-content: center; align-items: center; min-height: 120px; border-radius: 12px; background: var(--hb-night); border: 1px solid var(--hb-dusk); padding: 8px; }
    .qr-box svg { width: 112px; height: 112px; }
    .checkmark { width: 84px; height: 84px; margin: 0 auto; color: var(--hb-green); }
    .checkmark path { stroke-dasharray: 80; stroke-dashoffset: 80; animation: drawCheck 800ms var(--ease) forwards; }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    /* Chat app */
    #app { flex-direction: column; overflow: hidden; }
    .app-shell { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--hb-night); }
    .chat-header {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 62px;
      padding: max(8px, env(safe-area-inset-top)) 8px 8px;
      background: var(--hb-night);
      border-bottom: 1px solid var(--hb-dusk);
      display: grid;
      grid-template-columns: 20px 44px 1fr 44px 44px;
      align-items: center;
      gap: 2px;
    }
    .brand-watermark { color: var(--hb-rose); opacity: .4; font-size: 16px; line-height: 1; justify-self: center; position: relative; }
    .brand-watermark .rose-dot { width: 4px; height: 4px; position: absolute; right: -6px; top: 0; margin: 0; transform: none; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: var(--hb-dusk);
      color: var(--hb-rose);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
    }
    .partner-title { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .partner-name { color: var(--hb-petal); font-size: 15px; font-weight: 500; line-height: 1.2; }
    .connection-status { color: var(--hb-lock); font-size: 11px; display: flex; align-items: center; gap: 5px; min-height: 14px; }
    .status-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--hb-ghost); }
    .status-dot.online { background: var(--hb-green); }
    .status-dot.connecting { background: var(--hb-yellow); }
    .status-dot.offline { background: var(--hb-ghost); }
    .encrypted-note {
      min-height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 1px solid rgba(58,37,80,.55);
      color: var(--hb-ghost);
      font-size: 11px;
      background: var(--hb-night);
      position: relative;
      z-index: 9;
    }
    .encrypted-note button { color: inherit; display: flex; align-items: center; gap: 6px; }
    .connection-banner {
      max-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--hb-lock);
      background: var(--hb-deep);
      font-size: 13px;
      padding: 0 12px;
      transition: max-height 200ms ease-out, padding 200ms ease-out;
    }
    .connection-banner.show { max-height: 72px; padding-top: 8px; padding-bottom: 8px; }
    .connection-copy { min-width: 0; display: flex; align-items: center; gap: 8px; line-height: 1.35; }
    .connection-copy span:last-child { display: block; min-width: 0; }
    .reconnect-btn {
      flex: 0 0 auto;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--hb-rose);
      color: var(--hb-mist);
      font-size: 12px;
      font-weight: 500;
    }
    .spinner { width: 16px; height: 16px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-panel {
      max-height: 0;
      overflow: hidden;
      background: var(--hb-deep);
      border-bottom: 1px solid transparent;
      transition: max-height 260ms var(--ease), border-color 260ms ease;
      z-index: 8;
    }
    .search-panel.open { max-height: 260px; border-color: var(--hb-dusk); }
    .search-inner { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
    .search-results { max-height: 170px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
    .search-result {
      text-align: left;
      width: 100%;
      border-radius: 10px;
      background: var(--hb-night);
      border: 1px solid var(--hb-dusk);
      padding: 9px 10px;
      color: var(--hb-petal);
      font-size: 13px;
      line-height: 1.35;
    }
    mark { background: var(--hb-rose); color: var(--hb-night); border-radius: 3px; padding: 0 2px; }
    .chat-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 12px 8px;
      -webkit-user-select: none;
      user-select: none;
      scroll-behavior: smooth;
    }
    .message-list { min-height: 100%; display: flex; flex-direction: column; gap: 8px; }
    .empty-state {
      margin: auto;
      max-width: 260px;
      text-align: center;
      color: var(--hb-lock);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.4;
      padding-bottom: 40px;
    }
    .date-separator {
      align-self: center;
      background: var(--hb-deep);
      border-radius: 12px;
      padding: 4px 12px;
      color: var(--hb-lock);
      font-size: 11px;
      margin: 8px 0 4px;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: bubbleIn 250ms var(--ease);
      position: relative;
    }
    .message-row.mine { align-self: flex-end; align-items: flex-end; }
    .message-row.theirs { align-self: flex-start; align-items: flex-start; }
    .bubble {
      position: relative;
      padding: 9px 12px;
      line-height: 1.42;
      font-size: 15px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      border: 1px solid transparent;
    }
    .mine .bubble { background: var(--hb-rose); color: var(--hb-mist); border-radius: 18px 18px 4px 18px; }
    .theirs .bubble { background: var(--hb-deep); color: var(--hb-petal); border-radius: 18px 18px 18px 4px; }
    .bubble.flash { border-color: var(--hb-rose); }
    .deleted-message {
      color: var(--hb-ghost);
      font-size: 13px;
      font-style: italic;
      padding: 5px 2px;
    }
    .timestamp {
      font-size: 10px;
      color: var(--hb-lock);
      margin-top: 3px;
      display: flex;
      gap: 5px;
      align-items: center;
      min-height: 14px;
    }
    .mine .timestamp { justify-content: flex-end; }
    .ticks { font-size: 11px; color: var(--hb-lock); opacity: 0; animation: tickIn 160ms ease forwards; }
    .ticks.read { color: var(--hb-rose); }
    @keyframes tickIn { to { opacity: 1; } }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .reply-quote {
      background: rgba(58,37,80,.5);
      border-left: 2px solid var(--hb-rose);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 6px;
      color: inherit;
      font-size: 12px;
      opacity: .92;
    }
    .media-thumb {
      max-width: 220px;
      border-radius: 14px;
      display: block;
      background: var(--hb-night);
      border: 1px solid rgba(58,37,80,.6);
    }
    .video-thumb { position: relative; display: inline-block; max-width: 220px; }
    .video-thumb video { max-width: 100%; border-radius: 14px; background: #000; display: block; }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .play-overlay span {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(201,122,178,.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .transfer-progress { width: 100%; margin-top: 7px; display: flex; align-items: center; gap: 8px; }
    .progress-track { flex: 1; height: 4px; border-radius: 999px; background: var(--hb-dusk); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--hb-rose); width: 0; transition: width 160ms ease; }
    .progress-label { font-size: 11px; color: var(--hb-lock); min-width: 34px; text-align: right; }
    .reaction-badge {
      position: absolute;
      right: -5px;
      bottom: -10px;
      background: var(--hb-deep);
      border: 1px solid var(--hb-dusk);
      border-radius: 12px;
      font-size: 14px;
      padding: 2px 6px;
      z-index: 2;
    }
    .timer-meta { display: inline-flex; gap: 3px; align-items: center; font-size: 10px; color: var(--hb-lock); }
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 14px;
      background: var(--hb-deep);
      border-radius: 18px 18px 18px 4px;
      align-self: flex-start;
      width: 62px;
      min-height: 38px;
    }
    .typing-indicator span { width: 8px; height: 8px; border-radius: 999px; background: var(--hb-lock); animation: typingDot 600ms ease-in-out infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 100ms; }
    .typing-indicator span:nth-child(3) { animation-delay: 200ms; }
    @keyframes typingDot { 50% { transform: translateY(-5px); } }
    .scroll-fab {
      position: absolute;
      right: 18px;
      bottom: calc(92px + env(safe-area-inset-bottom));
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: var(--hb-rose);
      color: var(--hb-mist);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9;
    }
    .scroll-fab.show { display: flex; }

    /* Composer and sheets */
    .reply-preview {
      display: none;
      background: var(--hb-deep);
      border-left: 3px solid var(--hb-rose);
      padding: 8px 12px;
      min-height: 52px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .reply-preview.show { display: flex; }
    .reply-preview small { display: block; color: var(--hb-lock); font-size: 11px; margin-bottom: 3px; }
    .reply-preview span { display: block; color: var(--hb-petal); font-size: 13px; max-width: calc(100vw - 86px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .composer {
      padding: 8px 8px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--hb-dusk);
      background: var(--hb-night);
      display: flex;
      align-items: flex-end;
      gap: 2px;
      min-height: 66px;
    }
    .composer textarea {
      flex: 1;
      max-height: 120px;
      min-height: 46px;
      resize: none;
      background: var(--hb-deep);
      border: 1px solid var(--hb-dusk);
      border-radius: 22px;
      padding: 12px 16px;
      color: var(--hb-petal);
      font-size: 15px;
      line-height: 1.35;
      overflow-y: auto;
    }
    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: var(--hb-rose);
      color: var(--hb-mist);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 150ms ease-out;
      flex: 0 0 auto;
    }
    .send-btn:active { transform: scale(.92); }
    .recording-bar {
      display: none;
      flex: 1;
      min-height: 46px;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--hb-red);
      border-radius: 22px;
      background: var(--hb-deep);
    }

    function setupPwa() {

      const manifest = {
        name: "Hasbee",
        short_name: "Hasbee",
        display: "standalone",
        start_url: ".",
        theme_color: "#c97ab2",
        background_color: "#0d0812",
        icons: [{ src: `data:image/svg+xml,${encodeURIComponent(svgIcon)}`, sizes: "512x512", type: "image/svg+xml" }]
      };
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = `data:application/manifest+json,${encodeURIComponent(JSON.stringify(manifest))}`;
      document.head.appendChild(link);
      if ("serviceWorker" in navigator) {
        try {
          const swBlob = new Blob([`
            self.addEventListener('install', e => e.waitUntil(
              caches.open('hasbee-v1').then(c => c.addAll([location.href])).catch(() => undefined)
            ));
            self.addEventListener('fetch', e =>
              e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)).catch(() => fetch(e.request)))
            );
          `], { type: "application/javascript" });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        } catch (err) {
          showToast("Offline cache will enable after hosting.");
        }
      }
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
        req.onupgradeneeded = () => {
          const database = req.result;
          if (!database.objectStoreNames.contains("messages")) {
            database.createObjectStore("messages", { keyPath: "id", autoIncrement: true });
          }
          if (!database.objectStoreNames.contains("settings")) {
            database.createObjectStore("settings", { keyPath: "key" });
          }
          if (!database.objectStoreNames.contains("cryptoKeys")) {
            database.createObjectStore("cryptoKeys", { keyPath: "key" });
          }
          if (!database.objectStoreNames.contains("offlineQueue")) {
            database.createObjectStore("offlineQueue", { keyPath: "id", autoIncrement: true });
          }
          if (!database.objectStoreNames.contains("mediaCache")) {
            database.createObjectStore("mediaCache", { keyPath: "fileId" });
          }
        };
      });
    }

    function idbStore(name, mode = "readonly") {
      return db.transaction(name, mode).objectStore(name);
    }

    function idbGet(store, key) {
      return new Promise((resolve, reject) => {
        const req = idbStore(store).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbGetAll(store) {
      return new Promise((resolve, reject) => {
        const req = idbStore(store).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function idbPut(store, value) {
      return new Promise((resolve, reject) => {
        const req = idbStore(store, "readwrite").put(value);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbAdd(store, value) {
      return new Promise((resolve, reject) => {
        const req = idbStore(store, "readwrite").add(value);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbDelete(store, key) {
      return new Promise((resolve, reject) => {
        const req = idbStore(store, "readwrite").delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function idbClear(store) {
      return new Promise((resolve, reject) => {
        const req = idbStore(store, "readwrite").clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function loadSettings() {
      const rows = await idbGetAll("settings");
      settings = {};
      rows.forEach((row) => settings[row.key] = row.value);
      settings.name ??= "";
      settings.partnerName ??= "Tasbeeha";
      settings.autoLockMinutes ??= 5;
      settings.disappearTimer ??= 0;
      settings.notificationSound ??= true;
      settings.avatarColor ??= "#3a2550";
      settings.myId ??= crypto.randomUUID();
      app.myId = settings.myId;
      await putSetting("myId", settings.myId);
    }

    async function putSetting(key, value) {
      settings[key] = value;
      await idbPut("settings", { key, value });
    }

    /************************************************************
     * Encoding and Crypto
     ************************************************************/
    function bufToBase64(buffer) {
      const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function base64ToBuf(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function encodeSignal(obj) {
      return bufToBase64(encoder.encode(JSON.stringify(obj)));
    }

    function decodeSignal(code) {
      const clean = code.replace(/\s+/g, "");
      return JSON.parse(decoder.decode(base64ToBuf(clean)));
    }

    async function hashPin(pin, saltBase64 = null) {
      const salt = saltBase64 ? new Uint8Array(base64ToBuf(saltBase64)) : crypto.getRandomValues(new Uint8Array(16));
      const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(pin), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, 256);
      return { hash: bufToBase64(bits), salt: bufToBase64(salt) };
    }

    async function verifyPin(pin, hash, salt) {
      if (!hash || !salt) return false;
      const result = await hashPin(pin, salt);
      return timingSafeEqual(result.hash, hash);
    }

    function timingSafeEqual(a, b) {
      if (a.length !== b.length) return false;
      let diff = 0;
      for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
      return diff === 0;
    }

    async function ensureEcdhKeyPair() {
      const privateKeyRecord = await idbGet("cryptoKeys", "ecdhPrivate");
      if (privateKeyRecord?.value && settings.myPublicKey) return;
      const pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
      const publicRaw = await crypto.subtle.exportKey("raw", pair.publicKey);
      const privateJwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
      const nonExtractablePrivate = await crypto.subtle.importKey("jwk", privateJwk, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
      await idbPut("cryptoKeys", { key: "ecdhPrivate", value: nonExtractablePrivate });
      await putSetting("myPublicKey", bufToBase64(publicRaw));
    }

    async function deriveSharedKey(partnerPublicKeyBase64) {
      const privateRecord = await idbGet("cryptoKeys", "ecdhPrivate");
      if (!privateRecord?.value) throw new Error("Private key missing");
      const partnerPublic = await crypto.subtle.importKey("raw", base64ToBuf(partnerPublicKeyBase64), { name: "ECDH", namedCurve: "P-256" }, false, []);
      const aesKey = await crypto.subtle.deriveKey(
        { name: "ECDH", public: partnerPublic },
        privateRecord.value,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
      await idbPut("cryptoKeys", { key: "aesShared", value: aesKey });
      await putSetting("partnerPublicKey", partnerPublicKeyBase64);
      return aesKey;
    }

    async function ensureStorageKey() {
      const record = await idbGet("cryptoKeys", "storageAes");
      if (record?.value) return record.value;
      const legacy = await idbGet("cryptoKeys", "aesShared");
      if (legacy?.value) {
        await idbPut("cryptoKeys", { key: "storageAes", value: legacy.value });
        return legacy.value;
      }
      const fallback = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      await idbPut("cryptoKeys", { key: "storageAes", value: fallback });
      return fallback;
    }

    async function getSharedKey() {
      const record = await idbGet("cryptoKeys", "aesShared");
      if (!record?.value) throw new Error("Shared key missing");
      return record.value;
    }

    async function keyForPurpose(purpose) {
      return purpose === "wire" ? getSharedKey() : ensureStorageKey();
    }

    async function encryptObject(obj, purpose = "storage") {
      const key = await keyForPurpose(purpose);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const data = encoder.encode(JSON.stringify(obj));
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
      return { iv, data: encrypted };
    }

    async function decryptObject(data, iv, purpose = "storage") {
      const key = await keyForPurpose(purpose);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(iv) }, key, data);
      return JSON.parse(decoder.decode(plain));
    }

    function packEncrypted(iv, data) {
      const ivBytes = new Uint8Array(iv);
      const dataBytes = new Uint8Array(data);
      const packed = new Uint8Array(12 + dataBytes.length);
      packed.set(ivBytes, 0);
      packed.set(dataBytes, 12);
      return packed.buffer;
    }

    function unpackEncrypted(buffer) {
      const bytes = new Uint8Array(buffer);
      return { iv: bytes.slice(0, 12), data: bytes.slice(12).buffer };
    }

    function showScreen(name) {
      ["splash", "lock", "setup", "app"].forEach((id) => app.el[id].classList.toggle("active", id === name));
      if (name === "app") {
        app.unlocked = true;
        resetInactivityTimer();

        loadMessages().catch(() => showToast("Messages could not be loaded."));
      } else {
        app.unlocked = false;

    function showToast(message) {
      clearTimeout(toastTimer);
      app.el.toast.textContent = message;
      app.el.toast.classList.add("show");
      toastTimer = setTimeout(() => app.el.toast.classList.remove("show"), 3000);
    }

    function showModal({ title, body, fields = [], confirmText = "Done", danger = false, onConfirm }) {
      const modal = app.el.modal;
      modal.innerHTML = "";
      const card = document.createElement("div");
      card.className = "modal-card";
      card.innerHTML = `<h3>${escapeHtml(title)}</h3><p>${escapeHtml(body)}</p>`;
      const fieldEls = [];
      fields.forEach((field) => {
        const input = document.createElement("input");
        input.className = "field";
        input.type = field.type || "text";
        input.placeholder = field.placeholder || "";
        input.maxLength = field.maxLength || 200;
        input.value = field.value || "";
        input.inputMode = field.inputMode || "";
        card.appendChild(input);
        fieldEls.push(input);
      });
      const actions = document.createElement("div");
      actions.className = "modal-actions";
      const cancel = document.createElement("button");
      cancel.className = "secondary-btn";
      cancel.textContent = "Cancel";
      const confirm = document.createElement("button");
      confirm.className = `secondary-btn ${danger ? "danger-btn" : ""}`;
      confirm.textContent = confirmText;
      actions.append(cancel, confirm);
      card.appendChild(actions);
      modal.appendChild(card);
      modal.classList.add("show");
      cancel.onclick = () => modal.classList.remove("show");
      modal.onclick = (event) => { if (event.target === modal) modal.classList.remove("show"); };
      confirm.onclick = async () => {
        try {
          await onConfirm?.(fieldEls.map((el) => el.value));
          modal.classList.remove("show");
        } catch (err) {
          showToast(err.message || "That did not work.");
        }
      };
      fieldEls[0]?.focus();
    }

    /************************************************************
     * PIN Lock
     ************************************************************/
    function renderLockPad() {
      renderPad(app.el.lockPad, handleLockKey);
      updateLockDots(app.el.lockPinDots, lockPin);
    }

    function renderPad(container, handler) {
      const keys = ["1","2","3","4","5","6","7","8","9","*","0","back"];
      container.innerHTML = "";
      keys.forEach((key) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pin-key";
        btn.innerHTML = key === "back" ? icons.backspace : key;
        btn.addEventListener("click", () => handler(key));
        container.appendChild(btn);
      });
    }

    async function handleLockKey(key) {
      const lockUntil = Number(settings.lockUntil || 0);
      if (Date.now() < lockUntil) return startLockCountdownIfNeeded();
      if (key === "back") lockPin = lockPin.slice(0, -1);
      else if (/^\d$/.test(key) && lockPin.length < 6) lockPin += key;
      updateLockDots(app.el.lockPinDots, lockPin);
      if (lockPin.length === 6) {
        try {
          const mainOk = await verifyPin(lockPin, settings.pinHash, settings.pinSalt);
          const decoyOk = await verifyPin(lockPin, settings.decoyPinHash, settings.decoyPinSalt);
          if (mainOk || decoyOk) {
            app.decoyMode = decoyOk && !mainOk;
            lockPin = "";
            await putSetting("wrongAttempts", 0);
            updateLockDots(app.el.lockPinDots, lockPin);
            showScreen("app");
            return;
          }
          await wrongPin();
        } catch (err) {
          showToast("PIN check failed.");
        }
      }
    }

    async function wrongPin() {
      const attempts = Number(settings.wrongAttempts || 0) + 1;
      await putSetting("wrongAttempts", attempts);
      flashDots(app.el.lockPinDots);
      lockPin = "";
      setTimeout(() => updateLockDots(app.el.lockPinDots, lockPin), 420);
      if (attempts >= 5) {
        await putSetting("lockUntil", Date.now() + 30 * 60 * 1000);
        await putSetting("wrongAttempts", 0);
        startLockCountdownIfNeeded();
      } else {
        showToast("Wrong PIN.");
      }
    }

    function updateLockDots(container, value) {
      container.innerHTML = Array.from({ length: 6 }, (_, i) => `<span class="pin-dot ${i < value.length ? "filled" : ""}"></span>`).join("");
    }

    function flashDots(container) {
      container.classList.remove("shake");
      void container.offsetWidth;
      container.classList.add("shake");
      container.querySelectorAll(".pin-dot").forEach((dot) => dot.classList.add("error"));
      setTimeout(() => {
        container.classList.remove("shake");
        container.querySelectorAll(".pin-dot").forEach((dot) => dot.classList.remove("error"));
      }, 420);
    }

    function startLockCountdownIfNeeded() {
      clearInterval(lockCountdownTimer);
      const render = () => {
        const remaining = Number(settings.lockUntil || 0) - Date.now();
        if (remaining <= 0) {
          app.el.lockCountdown.textContent = "";
          clearInterval(lockCountdownTimer);
          putSetting("lockUntil", 0).catch(() => {});
          return;
        }
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000).toString().padStart(2, "0");
        app.el.lockCountdown.textContent = `Try again in ${mins}:${secs}`;
      };
      render();
      lockCountdownTimer = setInterval(render, 1000);
    }

    /************************************************************
     * WebRTC and Encrypted Transport
     ************************************************************/
    function createPeerConnection() {
      if (app.pc) {
        try { app.pc.close(); } catch (err) {}
      }
      app.pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      app.pc.oniceconnectionstatechange = () => {
        const state = app.pc.iceConnectionState;
        if (["connected", "completed"].includes(state)) setConnectionStatus("online");
        else if (["checking", "new"].includes(state)) setConnectionStatus("connecting");
        else setConnectionStatus("offline");
      };
      app.pc.onconnectionstatechange = () => {
        const state = app.pc.connectionState;
        if (state === "connected") setConnectionStatus("online");
        if (["disconnected", "failed", "closed"].includes(state)) setConnectionStatus("offline");
      };
      app.pc.ondatachannel = (event) => setupDataChannel(event.channel);
      setConnectionStatus("connecting");
      return app.pc;
    }

    function setupDataChannel(channel) {
      if (channel.label === "chat") app.chatChannel = channel;
      if (channel.label === "media") app.mediaChannel = channel;
      channel.binaryType = "arraybuffer";
      channel.onopen = () => {
        setConnectionStatus("online");
        flushOfflineQueue().catch(() => showToast("Offline queue could not be sent."));
        startHeartbeat();
      };
      channel.onclose = () => setConnectionStatus("offline");
      channel.onerror = () => setConnectionStatus("offline");
      channel.onmessage = (event) => receiveEncrypted(channel.label, event.data).catch(() => showToast("A message could not be decrypted."));
    }

    async function generateOfferCode() {
      await ensureEcdhKeyPair();
      const pc = createPeerConnection();
      setupDataChannel(pc.createDataChannel("chat", { ordered: true }));
      setupDataChannel(pc.createDataChannel("media", { ordered: true }));
      await pc.setLocalDescription(await pc.createOffer());
      await waitForIceGathering(pc);
      const signal = { app: "Hasbee", v: 1, kind: "offer", sdp: pc.localDescription, publicKey: settings.myPublicKey, name: settings.name || "Hassaan" };
      app.currentOfferCode = encodeSignal(signal);
      await putSetting("lastOfferCode", app.currentOfferCode);
      const offerBox = $("offerCode");
      const qrBox = $("offerQr");
      if (offerBox) offerBox.textContent = app.currentOfferCode;
      if (qrBox) qrBox.innerHTML = createQrSvg(app.currentOfferCode);
      if ($("reconnectOfferCode")) $("reconnectOfferCode").textContent = app.currentOfferCode;
      if ($("reconnectOfferQr")) $("reconnectOfferQr").innerHTML = createQrSvg(app.currentOfferCode);
      showToast("Offer code ready.");
    }

    async function useRemoteSignal(code) {
      if (!code.trim()) throw new Error("Paste a code first.");
      await ensureEcdhKeyPair();
      const signal = decodeSignal(code);
      if (signal.app !== "Hasbee" || !signal.sdp || !signal.publicKey) throw new Error("That is not a Hasbee code.");
      await deriveSharedKey(signal.publicKey);
      if (signal.name) {
        await putSetting("partnerName", signal.name);
        renderAppChrome();
      }
      if (signal.kind === "offer") {
        const pc = createPeerConnection();
        await pc.setRemoteDescription(signal.sdp);
        await pc.setLocalDescription(await pc.createAnswer());
        await waitForIceGathering(pc);
        const answer = { app: "Hasbee", v: 1, kind: "answer", sdp: pc.localDescription, publicKey: settings.myPublicKey, name: settings.name || "Tasbeeha" };
        app.currentAnswerCode = encodeSignal(answer);
        await putSetting("lastAnswerCode", app.currentAnswerCode);
        await putSetting("connectionPairedAt", Date.now());
        setupConnected = true;
        if ($("answerCode")) $("answerCode").textContent = app.currentAnswerCode;
        if ($("answerQr")) $("answerQr").innerHTML = createQrSvg(app.currentAnswerCode);
        if ($("reconnectAnswerCode")) $("reconnectAnswerCode").textContent = app.currentAnswerCode;
        if ($("reconnectAnswerQr")) $("reconnectAnswerQr").innerHTML = createQrSvg(app.currentAnswerCode);
        if ($("connectNext")) $("connectNext").textContent = "Continue";
        showToast("Answer code ready.");
      } else if (signal.kind === "answer") {
        if (!app.pc) throw new Error("Generate your offer first.");
        await app.pc.setRemoteDescription(signal.sdp);
        await putSetting("connectionPairedAt", Date.now());
        setupConnected = true;
        if ($("connectNext")) $("connectNext").textContent = "Continue";
        showToast("Connection answer saved.");
      } else {
        throw new Error("Unknown code type.");
      }
    }

    function waitForIceGathering(pc) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => {
          pc.removeEventListener("icegatheringstatechange", check);
          clearTimeout(timer);
          resolve();
        };
        const check = () => { if (pc.iceGatheringState === "complete") done(); };
        const timer = setTimeout(done, 2800);
        pc.addEventListener("icegatheringstatechange", check);
      });
    }

    async function sendEncrypted(channelName, envelope) {
      const channel = channelName === "media" ? app.mediaChannel : app.chatChannel;
      if (channel?.readyState === "open") {
        const encrypted = await encryptObject(envelope, "wire");
        const packed = packEncrypted(encrypted.iv, encrypted.data);
        channel.send(packed);
      } else {
        const encrypted = await encryptObject(envelope, "storage");
        await idbAdd("offlineQueue", { payload: encrypted.data, iv: encrypted.iv, timestamp: Date.now(), type: envelope.type, channel: channelName, storageEncrypted: true });
        setConnectionStatus("offline");
      }
    }

    async function receiveEncrypted(channelName, data) {
      const buffer = data instanceof Blob ? await data.arrayBuffer() : data;
      const packed = unpackEncrypted(buffer);
      const envelope = await decryptObject(packed.data, packed.iv, "wire");
      await handleEnvelope(envelope, channelName);
    }

    async function handleEnvelope(envelope) {
      lastHeartbeat = Date.now();
      switch (envelope.type) {
        case "ping":
          await sendEncrypted("chat", { type: "pong", timestamp: Date.now() });
          break;
        case "pong":
          setConnectionStatus("online");
          break;
        case "typing":
          showPartnerTyping();
          break;
        case "message":
          await receiveMessage(envelope.message);
          break;
        case "ack":
          await updateMessageStatus(envelope.clientId, "received");
          break;
        case "read":
          await updateMessageStatus(envelope.clientId, "read");
          break;
        case "reaction":
          await applyReaction(envelope.messageId, envelope.reaction, envelope.senderId, true);
          break;
        case "delete":
          await applyDelete(envelope.messageId, envelope.everyone, true);
          break;
        case "chunk":
          await receiveFileChunk(envelope);
          break;
        case "retransmit":
          await retransmitChunk(envelope.fileId, envelope.index);
          break;
        case "expire":
          await expireMessage(envelope.messageId, true);
          break;
      }
    }

    async function flushOfflineQueue() {
      const rows = await idbGetAll("offlineQueue");
      rows.sort((a, b) => a.timestamp - b.timestamp);
      for (const row of rows) {
        const channel = row.channel === "media" ? app.mediaChannel : app.chatChannel;
        if (channel?.readyState !== "open") return;
        if (row.storageEncrypted) {
          const envelope = await decryptObject(row.payload, row.iv, "storage");
          const encrypted = await encryptObject(envelope, "wire");
          channel.send(packEncrypted(encrypted.iv, encrypted.data));
        } else {
          channel.send(packEncrypted(row.iv, row.payload));
        }
        await idbDelete("offlineQueue", row.id);
      }
    }

    function startHeartbeat() {
      clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (app.chatChannel?.readyState === "open") {
          sendEncrypted("chat", { type: "ping", timestamp: Date.now() }).catch(() => setConnectionStatus("offline"));
        }
        if (lastHeartbeat && Date.now() - lastHeartbeat > 70000) setConnectionStatus("offline");
      }, 30000);
    }

    function setConnectionStatus(status) {
      app.status = status;
      const dotClass = status === "online" ? "online" : status === "connecting" ? "connecting" : "offline";
      const text = status === "online" ? "online" : status === "connecting" ? "connecting" : lastHeartbeat ? `last seen ${timeAgo(lastHeartbeat)}` : "offline - saved";
      app.el.connectionStatus.innerHTML = `<span class="status-dot ${dotClass}"></span><span>${escapeHtml(text)}</span>`;
      app.el.connectionBanner.classList.toggle("show", status === "offline" && app.unlocked);
    }

    /************************************************************
     * Messages, IndexedDB, Rendering
     ************************************************************/
    async function loadMessages() {
      if (app.decoyMode) {
        app.messages = [];
        renderMessages();
        return;
      }
      const rows = await idbGetAll("messages");
      rows.sort((a, b) => a.timestamp - b.timestamp);
      const loaded = [];
      for (const row of rows) {
        if (row.deletedForMe) continue;
        if (row.expiresAt && row.expiresAt <= Date.now()) {
          await idbDelete("messages", row.id);
          continue;
        }
        let payload = {};
        try {
          payload = await decryptObject(row.content, row.iv);
        } catch (err) {
          payload = { text: "Unable to decrypt this message." };
        }
        loaded.push({ ...row, payload });
      }
      app.messages = loaded;
      await loadMediaCache();
      renderMessages();
      scrollToBottom();
      startDisappearSweep();
    }

    async function loadMediaCache() {
      const mediaRows = await idbGetAll("mediaCache");
      mediaRows.forEach((row) => {
        app.mediaBlobs.set(row.fileId, row.blob);
        if (!app.mediaUrls.has(row.fileId)) app.mediaUrls.set(row.fileId, URL.createObjectURL(row.blob));
      });
    }

    async function saveMessage(meta, payload) {
      if (app.decoyMode) {
        const message = {
          id: Date.now() + Math.floor(Math.random() * 1000),
          senderId: meta.senderId,
          senderName: meta.senderName || "",
          clientId: meta.clientId || crypto.randomUUID(),
          type: meta.type,
          timestamp: meta.timestamp || Date.now(),
          status: meta.status || "sent",
          replyToId: meta.replyToId ?? null,
          replySnapshot: meta.replySnapshot ?? null,
          reactions: meta.reactions || [],
          deletedForMe: false,
          deletedForEveryone: false,
          expiresAt: meta.expiresAt ?? null,
          fileId: meta.fileId ?? null,
          payload
        };
        app.messages.push(message);
        renderMessages();
        if (isNearBottom) scrollToBottom();
        return message;
      }
      const encrypted = await encryptObject(payload);
      const record = {
        senderId: meta.senderId,
        senderName: meta.senderName || "",
        clientId: meta.clientId || crypto.randomUUID(),
        type: meta.type,
        content: encrypted.data,
        iv: encrypted.iv,
        timestamp: meta.timestamp || Date.now(),
        status: meta.status || "sent",
        replyToId: meta.replyToId ?? null,
        replySnapshot: meta.replySnapshot ?? null,
        reactions: meta.reactions || [],
        deletedForMe: false,
        deletedForEveryone: false,
        expiresAt: meta.expiresAt ?? null,
        fileId: meta.fileId ?? null
      };
      const id = await idbAdd("messages", record);
      const message = { ...record, id, payload };
      app.messages.push(message);
      renderMessages();
      if (isNearBottom) scrollToBottom();
      return message;
    }

    async function updateStoredMessage(message) {
      const record = await idbGet("messages", message.id);
      if (!record) return;
      const { payload, ...meta } = message;
      await idbPut("messages", { ...record, ...meta });
    }

    function onInputChanged() {
      autoGrowTextarea();
      if (app.messageTypingSent) clearTimeout(app.messageTypingSent);
      sendEncrypted("chat", { type: "typing", timestamp: Date.now() }).catch(() => {});
      app.messageTypingSent = setTimeout(() => {}, 1200);
    }

    function autoGrowTextarea() {
      const input = app.el.messageInput;
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }

    async function sendTextMessage() {
      const text = app.el.messageInput.value;
      if (!text.trim()) return;
      const reply = app.replyTo;
      const meta = baseMessageMeta("text", null, reply);
      const message = await saveMessage(meta, { text });
      app.el.messageInput.value = "";
      autoGrowTextarea();
      clearReply();
      if (!app.decoyMode) await sendEncrypted("chat", { type: "message", message: wireMessage(message) });
    }

    function baseMessageMeta(type, fileId = null, reply = null) {
      const expiresAt = Number(settings.disappearTimer || 0) ? Date.now() + Number(settings.disappearTimer) : null;
      return {
        clientId: crypto.randomUUID(),
        senderId: app.myId,
        senderName: settings.name || "Hassaan",
        type,
        timestamp: Date.now(),
        status: "sent",
        replyToId: reply?.id ?? null,
        replySnapshot: reply ? {
          id: reply.id,
          senderName: reply.senderId === app.myId ? "yourself" : (settings.partnerName || "Tasbeeha"),
          text: messagePlainText(reply).slice(0, 120)
        } : null,
        expiresAt,
        fileId
      };
    }

    function wireMessage(message) {
      return {
        id: message.id,
        clientId: message.clientId,
        senderId: message.senderId,
        senderName: message.senderName,
        type: message.type,
        timestamp: message.timestamp,
        payload: message.payload,
        replyToId: message.replyToId,
        replySnapshot: message.replySnapshot,
        expiresAt: message.expiresAt,
        fileId: message.fileId
      };
    }

    async function receiveMessage(wire) {
      if (app.messages.some((msg) => msg.clientId === wire.clientId)) return;
      const encrypted = await encryptObject(wire.payload);
      const record = {
        senderId: wire.senderId,
        senderName: wire.senderName || settings.partnerName || "Tasbeeha",
        clientId: wire.clientId,
        type: wire.type,
        content: encrypted.data,
        iv: encrypted.iv,
        timestamp: wire.timestamp || Date.now(),
        status: "received",
        replyToId: wire.replyToId ?? null,
        replySnapshot: wire.replySnapshot ?? null,
        reactions: [],
        deletedForMe: false,
        deletedForEveryone: false,
        expiresAt: wire.expiresAt ?? null,
        fileId: wire.fileId ?? null
      };
      const id = await idbAdd("messages", record);
      app.messages.push({ ...record, id, payload: wire.payload });
      renderMessages();
      if (isNearBottom) scrollToBottom();
      await sendEncrypted("chat", { type: "ack", clientId: wire.clientId, timestamp: Date.now() });
      await sendEncrypted("chat", { type: "read", clientId: wire.clientId, timestamp: Date.now() });
      notifyNewMessage();
    }

    async function updateMessageStatus(clientId, status) {
      const msg = app.messages.find((item) => item.clientId === clientId);
      if (!msg || msg.senderId !== app.myId) return;
      msg.status = status;
      await updateStoredMessage(msg);
      renderMessages({ preserveScroll: true });
    }

    function scheduleRender() {
      if (messageRenderScheduled) return;
      messageRenderScheduled = true;
      requestAnimationFrame(() => {
        messageRenderScheduled = false;
        renderMessages({ preserveScroll: true });
      });
    }

    function renderMessages(options = {}) {
      const listEl = app.el.messageList;
      const chat = app.el.chatArea;
      const previousTop = chat.scrollTop;
      const messages = app.messages.filter((msg) => !msg.deletedForMe);
      listEl.innerHTML = "";
      if (!messages.length && !app.partnerTyping) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = app.decoyMode ? "A brand new chat." : "No one else, no noise, just your little room.";
        listEl.appendChild(empty);
        return;
      }
      const estimate = 96;
      let start = 0;
      let end = messages.length;
      if (messages.length > 160) {
        start = Math.max(0, Math.floor((chat.scrollTop - 400) / estimate));
        end = Math.min(messages.length, Math.ceil((chat.scrollTop + chat.clientHeight + 400) / estimate));
        const topSpacer = document.createElement("div");
        topSpacer.style.height = `${start * estimate}px`;
        listEl.appendChild(topSpacer);
      }
      for (let i = start; i < end; i++) {
        const msg = messages[i];
        if (shouldShowDate(messages, i)) listEl.appendChild(createDateSeparator(msg.timestamp));
        listEl.appendChild(renderMessage(msg));
      }
      if (messages.length > 160) {
        const bottomSpacer = document.createElement("div");
        bottomSpacer.style.height = `${Math.max(0, messages.length - end) * estimate}px`;
        listEl.appendChild(bottomSpacer);
      }
      if (app.partnerTyping) listEl.appendChild(renderTypingIndicator());
      if (options.preserveScroll) chat.scrollTop = previousTop;
    }

    function renderMessage(msg) {
      const mine = msg.senderId === app.myId;
      const row = document.createElement("div");
      row.className = `message-row ${mine ? "mine" : "theirs"}`;
      row.dataset.id = msg.id;
      row.dataset.clientId = msg.clientId;
      const deleted = msg.deletedForEveryone;
      const bubble = document.createElement("div");
      bubble.className = deleted ? "deleted-message" : "bubble";
      if (deleted) {
        bubble.textContent = "This message was deleted";
      } else {
        if (msg.replySnapshot) bubble.appendChild(renderReplyQuote(msg.replySnapshot));
        bubble.appendChild(renderPayload(msg));
        if (msg.reactions?.length) {
          const badge = document.createElement("button");
          badge.className = "reaction-badge";
          badge.textContent = msg.reactions.map((r) => r.emoji).join("");
          badge.onclick = (event) => {
            event.stopPropagation();
            applyReaction(msg.id, msg.reactions[0].emoji, app.myId, false).catch(() => showToast("Reaction could not be removed."));
          };
          bubble.appendChild(badge);
        }
      }
      row.appendChild(bubble);
      const meta = document.createElement("div");
      meta.className = "timestamp";
      meta.innerHTML = `${formatTime(msg.timestamp)} ${renderExpireMeta(msg)} ${mine ? renderTicks(msg.status) : ""}`;
      row.appendChild(meta);
      bindMessageGestures(row, msg);
      return row;
    }

    function renderReplyQuote(snapshot) {
      const div = document.createElement("div");
      div.className = "reply-quote";
      div.textContent = snapshot.text || "Message";
      return div;
    }

    function renderPayload(msg) {
      const wrap = document.createElement("div");
      if (msg.type === "text") {
        wrap.innerHTML = highlightText(escapeHtml(msg.payload.text || ""), activeSearch);
      } else if (msg.type === "image") {
        const img = document.createElement("img");
        img.className = "media-thumb";
        img.alt = "Shared image";
        img.src = app.mediaUrls.get(msg.fileId) || "";
        img.onclick = () => openLightbox(img.src);
        wrap.appendChild(img);
        appendProgress(wrap, msg);
      } else if (msg.type === "video") {
        const outer = document.createElement("div");
        outer.className = "video-thumb";
        const video = document.createElement("video");
        video.src = app.mediaUrls.get(msg.fileId) || "";
        video.preload = "metadata";
        video.controls = false;
        outer.appendChild(video);
        const overlay = document.createElement("div");
        overlay.className = "play-overlay";
        overlay.innerHTML = `<span><svg width="18" height="18" viewBox="0 0 24 24" fill="#fdf6fb"><path d="M8 5v14l11-7z"/></svg></span>`;
        outer.appendChild(overlay);
        outer.onclick = () => {
          video.controls = true;
          overlay.style.display = "none";
          video.play().catch(() => showToast("Video playback was blocked."));
        };
        wrap.appendChild(outer);
        appendProgress(wrap, msg);
      } else if (msg.type === "audio") {
        wrap.appendChild(renderVoiceNote(msg));
      }
      return wrap;
    }

    function appendProgress(wrap, msg) {
      const progress = app.messageProgress.get(msg.fileId);
      if (progress == null || progress >= 100) return;
      const div = document.createElement("div");
      div.className = "transfer-progress";
      div.innerHTML = `<div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div><span class="progress-label">${progress}%</span>`;
      wrap.appendChild(div);
    }

    function renderVoiceNote(msg) {
      const node = document.createElement("div");
      node.className = "voice-note";
      const isPlaying = app.activeAudioId === msg.id;
      const duration = msg.payload.duration ? formatDuration(msg.payload.duration) : "00:00";
      const speed = app.voiceSpeeds.get(msg.id) || 1;
      node.innerHTML = `
        <button class="voice-play" data-action="voice-play">${isPlaying ? icons.pause : icons.play}</button>
        <div class="wave-static" data-wave="${msg.id}">${staticWaveBars(msg.id)}</div>
        <div class="voice-meta"><span>${duration}</span><button class="speed-btn" data-action="speed">${speed}×</button></div>
      `;
      node.querySelector('[data-action="voice-play"]').onclick = (event) => {
        event.stopPropagation();
        toggleVoicePlayback(msg).catch(() => showToast("Voice note could not play."));
      };
      node.querySelector('[data-action="speed"]').onclick = (event) => {
        event.stopPropagation();
        cycleVoiceSpeed(msg.id);
      };
      return node;
    }

    function staticWaveBars(id) {
      let html = "";
      for (let i = 0; i < 30; i++) {
        const h = 6 + ((id * (i + 3) * 7) % 20);
        html += `<span style="height:${h}px;background:${i < 0 ? "#fdf6fb" : "rgba(255,255,255,.2)"}"></span>`;
      }
      return html;
    }

    function renderTypingIndicator() {
      const div = document.createElement("div");
      div.className = "typing-indicator";
      div.innerHTML = "<span></span><span></span><span></span>";
      return div;
    }

    function renderExpireMeta(msg) {
      if (!msg.expiresAt) return "";
      const remaining = Math.max(0, msg.expiresAt - Date.now());
      return `<span class="timer-meta">${icons.timer}${formatRemaining(remaining)}</span>`;
    }

    function renderTicks(status) {
      if (status === "read") return `<span class="ticks read">✓✓</span>`;
      if (status === "received") return `<span class="ticks">✓✓</span>`;
      return `<span class="ticks">✓</span>`;
    }

    function shouldShowDate(messages, index) {
      if (index === 0) return true;
      return new Date(messages[index - 1].timestamp).toDateString() !== new Date(messages[index].timestamp).toDateString();
    }

    function createDateSeparator(timestamp) {
      const div = document.createElement("div");
      div.className = "date-separator";
      div.textContent = formatDateSeparator(timestamp);
      return div;
    }

    function bindMessageGestures(row, msg) {
      let pressTimer = null;
      let startX = 0;
      let startY = 0;
      row.addEventListener("pointerdown", (event) => {
        startX = event.clientX;
        startY = event.clientY;
        pressTimer = setTimeout(() => showMessageMenu(row, msg), 500);
      });
      row.addEventListener("pointerup", (event) => {
        clearTimeout(pressTimer);
        const dx = event.clientX - startX;
        const dy = Math.abs(event.clientY - startY);
        if (dx > 60 && dy < 40) setReply(msg);
      });
      row.addEventListener("pointermove", (event) => {
        if (Math.abs(event.clientX - startX) > 12 || Math.abs(event.clientY - startY) > 12) clearTimeout(pressTimer);
      });
      row.addEventListener("pointercancel", () => clearTimeout(pressTimer));
    }

    function showMessageMenu(row, msg) {
      app.currentMenuMessage = msg;
      const rect = row.getBoundingClientRect();
      app.el.reactionPicker.innerHTML = ["❤️", "😂", "😮", "😢", "😡", "👍"].map((emoji) => `<button type="button">${emoji}</button>`).join("");
      [...app.el.reactionPicker.children].forEach((btn) => {
        btn.onclick = (event) => {
          event.stopPropagation();
          applyReaction(msg.id, btn.textContent, app.myId, false).catch(() => showToast("Reaction could not be saved."));
          closeFloatingMenus();
        };
      });
      app.el.reactionPicker.style.left = `${Math.max(8, Math.min(window.innerWidth - 220, rect.left))}px`;
      app.el.reactionPicker.style.top = `${Math.max(72, rect.top - 50)}px`;
      app.el.reactionPicker.classList.add("show");
      app.el.contextMenu.innerHTML = `
        <button data-action="copy">Copy</button>
        <button data-action="reply">Reply</button>
        <button data-action="deleteMe">Delete for me</button>
        <button data-action="deleteAll" class="delete-all">Delete for everyone</button>
      `;
      app.el.contextMenu.style.left = `${Math.max(8, Math.min(window.innerWidth - 204, rect.left))}px`;
      app.el.contextMenu.style.top = `${Math.min(window.innerHeight - 190, rect.bottom + 8)}px`;
      app.el.contextMenu.classList.add("show");
      app.el.contextMenu.querySelectorAll("button").forEach((btn) => btn.onclick = () => handleContextAction(btn.dataset.action, msg));
    }

    async function handleContextAction(action, msg) {
      closeFloatingMenus();
      if (action === "copy") {
        await navigator.clipboard.writeText(messagePlainText(msg));
        showToast("Copied.");
      }
      if (action === "reply") setReply(msg);
      if (action === "deleteMe") {
        msg.deletedForMe = true;
        if (!app.decoyMode) await updateStoredMessage(msg);
        renderMessages();
      }
      if (action === "deleteAll") {
        await applyDelete(msg.id, true, false);
      }
    }

    async function applyReaction(messageId, emoji, senderId, remote) {
      const msg = app.messages.find((item) => item.id === Number(messageId) || item.clientId === messageId);
      if (!msg) return;
      msg.reactions ||= [];
      const existing = msg.reactions.findIndex((r) => r.senderId === senderId && r.emoji === emoji);
      if (existing >= 0) msg.reactions.splice(existing, 1);
      else {
        msg.reactions = msg.reactions.filter((r) => r.senderId !== senderId);
        msg.reactions.push({ emoji, senderId });
      }
      if (!app.decoyMode) await updateStoredMessage(msg);
      renderMessages({ preserveScroll: true });
      if (!remote && !app.decoyMode) await sendEncrypted("chat", { type: "reaction", messageId: msg.clientId, reaction: emoji, senderId: app.myId });
    }

    async function applyDelete(messageId, everyone, remote) {
      const msg = app.messages.find((item) => item.id === Number(messageId) || item.clientId === messageId);
      if (!msg) return;
      if (everyone) msg.deletedForEveryone = true;
      else msg.deletedForMe = true;
      if (!app.decoyMode) await updateStoredMessage(msg);
      renderMessages();
      if (everyone && !remote && !app.decoyMode) await sendEncrypted("chat", { type: "delete", messageId: msg.clientId, everyone: true });
    }

    function setReply(msg) {
      app.replyTo = msg;
      app.el.replyWho.textContent = `Replying to ${msg.senderId === app.myId ? "yourself" : (settings.partnerName || "Tasbeeha")}`;
      app.el.replyText.textContent = messagePlainText(msg).slice(0, 60);
      app.el.replyPreview.classList.add("show");
      app.el.messageInput.focus();
    }

    function clearReply() {
      app.replyTo = null;
      app.el.replyPreview.classList.remove("show");
    }

    function showPartnerTyping() {
      app.partnerTyping = true;
      clearTimeout(app.typingTimeout);
      app.typingTimeout = setTimeout(() => {
        app.partnerTyping = false;
        renderMessages({ preserveScroll: true });
      }, 1800);
      renderMessages({ preserveScroll: true });
      if (isNearBottom) scrollToBottom();
    }

    function onChatScroll() {
      const chat = app.el.chatArea;
      isNearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
      app.el.scrollFab.classList.toggle("show", chat.scrollHeight - chat.scrollTop - chat.clientHeight > 200);
      if (app.messages.length > 160) scheduleRender();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        app.el.chatArea.scrollTop = app.el.chatArea.scrollHeight;
        isNearBottom = true;
        app.el.scrollFab.classList.remove("show");
      });
    }

    /************************************************************
     * Emoji Picker

    }

      recent.unshift(emoji);
